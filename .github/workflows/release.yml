name: Manual release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and local packaging
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Report toolchain
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Test
        run: swift test

      - name: Verify development packaging
        run: ./scripts/package-release.sh
